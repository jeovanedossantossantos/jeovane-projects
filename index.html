<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfólio de projetos de Jeovane dos Santos">
    <title>Jeovane dos Santos | Projetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-font-sans-serif: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            --bs-primary: #0f766e;
            --bs-primary-rgb: 15, 118, 110;
            --hero-bg: #12263a;
        }

        [data-bs-theme="dark"] {
            --hero-bg: #0b1622;
        }

        body { background-color: var(--bs-tertiary-bg); }

        .btn-primary {
            --bs-btn-bg: #0f766e;
            --bs-btn-border-color: #0f766e;
            --bs-btn-hover-bg: #0b5f59;
            --bs-btn-hover-border-color: #0b5f59;
            --bs-btn-active-bg: #0a534e;
            --bs-btn-active-border-color: #0a534e;
        }

        .hero {
            background: var(--hero-bg);
            color: #fff;
            padding: 5rem 0 6rem;
        }
        .hero h1 { font-weight: 800; letter-spacing: -.02em; }
        .hero .lead { color: rgba(255, 255, 255, .78); max-width: 42rem; }

        .toolbar {
            margin-top: -2.25rem;
            position: relative;
            z-index: 2;
        }

        .filter-pills .nav-link {
            color: var(--bs-body-color);
            border-radius: 999px;
            font-weight: 500;
            white-space: nowrap;
        }
        .filter-pills .nav-link.active {
            background-color: #0f766e;
            color: #fff;
        }
        .filter-pills .badge { font-weight: 500; }

        .scroll-x { overflow-x: auto; scrollbar-width: thin; }

        .project-card {
            transition: box-shadow .2s ease, transform .2s ease;
        }
        .project-card:hover {
            box-shadow: var(--bs-box-shadow-lg);
            transform: translateY(-3px);
        }
        .project-card .thumb {
            aspect-ratio: 16 / 10;
            object-fit: cover;
            background: var(--bs-secondary-bg);
        }

        @media (prefers-reduced-motion: reduce) {
            .project-card { transition: none; }
            .project-card:hover { transform: none; }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand navbar-dark position-absolute top-0 w-100" style="z-index: 3;">
        <div class="container">
            <span class="navbar-brand fw-bold">Jeovane</span>
            <button id="theme-toggle" class="btn btn-outline-light btn-sm ms-auto" type="button"
                aria-label="Alternar tema claro e escuro">
                <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="container pt-4">
            <h1 class="display-5 mb-3">Olá, meu nome é Jeovane!</h1>
            <p class="lead mb-4">
                Aqui estão alguns projetos que fiz durante minha jornada de estudos.
                Para conhecer outros trabalhos, acesse meu GitHub. Para conversar, fale comigo no LinkedIn.
            </p>
            <div class="d-flex flex-wrap gap-2">
                <a href="https://github.com/jeovanedossantossantos" target="_blank" rel="noopener noreferrer"
                    class="btn btn-light">
                    <i class="bi bi-github me-2" aria-hidden="true"></i>GitHub
                </a>
                <a href="https://www.linkedin.com/in/jeovanesantos/" target="_blank" rel="noopener noreferrer"
                    class="btn btn-outline-light">
                    <i class="bi bi-linkedin me-2" aria-hidden="true"></i>LinkedIn
                </a>
            </div>
        </div>
    </header>

    <main class="container pb-5">
        <!-- Filtros e busca -->
        <section class="toolbar" aria-label="Filtros">
            <div class="card border-0 shadow">
                <div class="card-body p-3">
                    <div class="row g-3 align-items-center">
                        <div class="col-lg-8">
                            <div class="scroll-x">
                                <ul id="filters" class="nav nav-pills filter-pills flex-nowrap gap-1" role="tablist">
                                    <!-- Filtros gerados via JS -->
                                </ul>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                                <input id="search" type="search" class="form-control" placeholder="Buscar projeto"
                                    aria-label="Buscar projeto">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Resultado -->
        <p id="count" class="text-body-secondary mt-4 mb-3" aria-live="polite"></p>

        <section id="projects" class="row g-4" aria-label="Projetos">
            <!-- Cards gerados via JS -->
        </section>

        <div id="empty" class="text-center text-body-secondary py-5 d-none">
            <i class="bi bi-folder2-open fs-1 d-block mb-2" aria-hidden="true"></i>
            Nenhum projeto encontrado. Tente outro filtro ou outro termo.
        </div>
    </main>

    <footer class="border-top py-4 text-center text-body-secondary small">
        &copy; <span id="year"></span> Jeovane dos Santos
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
</body>
</html>
